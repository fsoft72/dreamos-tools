[package]
name = "dreamos-install"
version = "0.1.0"
edition = "2021"
rust-version = "1.91"

[dependencies]
gtk4 = { version = "0.10", features = ["v4_10"] }
vte4 = { version = "0.9", features = ["v0_78"] }
pulldown-cmark = { version = "0.13", default-features = false }
thiserror = "2"
libc = "0.2"

[profile.release]
opt-level = 2
strip = true
