[package]
name = "nvidia-installer"
version = "0.1.0"
edition = "2021"
rust-version = "1.91"

[dependencies]
gtk4 = { version = "0.10", features = ["v4_10"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
libc = "0.2"

[profile.release]
opt-level = 2
strip = true
